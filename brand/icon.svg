<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0E1830"/>
    </linearGradient>
    <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- fond plein cadre (HA arrondit les coins a l'affichage) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- ondes radio (emises depuis le coin haut-droit du volet) -->
  <g fill="none" stroke="#22D3EE" stroke-linecap="round">
    <path d="M319.99 159.70 A46 46 0 0 1 351.84 228.0" stroke-width="15" opacity="0.92"/>
    <path d="M325.54 128.19 A78 78 0 0 1 379.55 244.0" stroke-width="15" opacity="0.62"/>
    <path d="M331.10 96.67 A110 110 0 0 1 407.26 260.0" stroke-width="15" opacity="0.38"/>
  </g>
  <circle cx="312" cy="205" r="11" fill="#67E8F9"/>

  <!-- volet roulant -->
  <g>
    <rect x="120" y="150" width="180" height="30" rx="9" fill="#67E8F9"/>
    <rect x="120" y="188" width="180" height="18" rx="6" fill="url(#slat)" opacity="0.97"/>
    <rect x="120" y="214" width="180" height="18" rx="6" fill="url(#slat)" opacity="0.90"/>
    <rect x="120" y="240" width="180" height="18" rx="6" fill="url(#slat)" opacity="0.84"/>
    <rect x="120" y="266" width="180" height="18" rx="6" fill="url(#slat)" opacity="0.78"/>
    <rect x="120" y="292" width="180" height="18" rx="6" fill="url(#slat)" opacity="0.72"/>
    <rect x="120" y="320" width="180" height="24" rx="9" fill="#22D3EE"/>
  </g>
</svg>
